<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semainier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semainier">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<style>
:root{--navy:#1F3864;--bg:#f2f2f7;--card:#fff;--ink:#111;--mut:#6b7280;--line:#d9dbe1;--in:#FFF2CC;--inink:#0000cc}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mut:#9ca3af;--line:#3a3a3c;--in:#3b3317;--inink:#8ab4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Arial,sans-serif;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:20px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:grid;grid-template-columns:92px 1fr 84px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row b{font-size:15px}
select,input{font:inherit;width:100%;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--in);color:var(--inink);min-height:44px}
input[type=number]{text-align:center}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;height:44px;line-height:normal;text-align:center;text-align-last:center}
input[type=date]::-webkit-date-and-time-value{text-align:center;min-height:1.2em}
select{height:44px;min-width:0;text-overflow:ellipsis}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 4px 2px}
table{width:100%;border-collapse:collapse;text-align:center}
th{background:var(--navy);color:#fff;font-size:10px;padding:8px 2px}
td{padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
td:first-child{text-align:left;font-weight:700}
tfoot td{font-weight:700;background:var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0}
.wk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px;align-items:end}
.wk>div{min-width:0}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
button{font:inherit;width:100%;min-height:46px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;margin-top:4px}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{margin:0;min-height:40px;background:transparent;color:var(--ink);font-weight:500;border-radius:8px}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
td.over{color:#c0392b;font-weight:700}
.note{color:var(--mut);font-size:13px;margin:10px 4px}
</style>
</head>
<body>
<main>
<h1>Semainier</h1>
<div class="sub">EF · Qualité · Sortie longue</div>

<div class="card wk">
  <div><label for="start">Semaine du</label><input type="date" id="start"></div>
  <div><label for="wtype">Type de semaine</label>
    <select id="wtype"><option value="1">1 séance qualité</option><option value="2">2 séances qualité</option></select></div>
</div>

<div class="card">
  <label>Reste à faire calé sur</label>
  <div class="seg" id="seg"><button type="button" data-m="libre">Mes sorties</button><button type="button" data-m="obj">Mon objectif</button></div>
  <div id="objwrap" style="display:none;margin-top:10px">
    <label for="obj">Objectif km de la semaine</label>
    <input type="number" inputmode="decimal" step="0.1" min="0" placeholder="ex. 55" id="obj">
  </div>
</div>

<div class="card" id="days"></div>

<div class="card">
  <table id="rt"></table>
  <div class="note" style="margin:8px 0 0" id="rnote"></div>
</div>

<button class="sec" id="reset">Nouvelle semaine</button>
<p class="note">Théorique : 1 séance de qualité = 50 / 20 / 30 % ; 2 séances = 38 / 33 / 29 % (EF / Qualité / SL). Qualité = séance entière, échauffement et retour au calme compris. Les données restent sur cet appareil.</p>
</main>
<script>
const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const TYPES=["","Repos","EF","Qualité","Sortie longue"];
const THEO={1:{"EF":.5,"Qualité":.2,"Sortie longue":.3},2:{"EF":.38,"Qualité":.33,"Sortie longue":.29}};
const KEY="semainier-v1";
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days){if(!s.mode)s.mode="libre";return s}}catch(e){}return fresh()}
function monday(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d.toISOString().slice(0,10)}
function fresh(){return{start:monday(),wtype:"1",obj:"",mode:"libre",days:JOURS.map(()=>({t:"",km:""}))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const daysEl=$("days");
JOURS.forEach((j,i)=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<b>${j}</b><select data-i="${i}">${TYPES.map(t=>`<option value="${t}">${t||"—"}</option>`).join("")}</select><input type="number" inputmode="decimal" step="0.1" min="0" placeholder="km" data-k="${i}">`;
  daysEl.appendChild(r);
});
const tot=document.createElement("div");tot.className="tot";tot.innerHTML='<span>Total semaine</span><span id="wk">0.0 km</span>';daysEl.appendChild(tot);
const num=v=>parseFloat(String(v).replace(",","."))||0;
const r1=x=>Math.round(x*10)/10;
function render(keep){
  $("start").value=S.start;$("wtype").value=S.wtype;
  if(!keep)$("obj").value=S.obj||"";
  daysEl.querySelectorAll("select").forEach(s=>s.value=S.days[s.dataset.i].t);
  if(!keep)daysEl.querySelectorAll("input").forEach(n=>n.value=S.days[n.dataset.k].km);
  const obj=S.mode==="obj";
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===(obj?"obj":"libre")));
  $("objwrap").style.display=obj?"block":"none";
  const th=THEO[S.wtype],K=Object.keys(th);
  const sum={"EF":0,"Qualité":0,"Sortie longue":0};
  S.days.forEach(d=>{if(sum[d.t]!==undefined)sum[d.t]+=num(d.km)});
  const all=K.reduce((a,k)=>a+sum[k],0);
  const wk=S.days.reduce((a,d)=>a+num(d.km),0);
  $("wk").textContent=wk.toFixed(1)+" km";
  const has=String(S.obj||"")!=="";
  let T=null;
  if(obj){T=has?num(S.obj):null}else{T=Math.max(...K.map(k=>sum[k]/th[k]))}
  const tgt={},rest={};
  K.forEach(k=>{tgt[k]=T===null?null:T*th[k];rest[k]=T===null?null:Math.max(0,r1(tgt[k]-sum[k]))});
  const f=v=>v===null?"–":v.toFixed(1);
  const rows=K.map(k=>{const p=all?sum[k]/all:0;const over=obj&&T!==null&&sum[k]>tgt[k]+0.05;
    return`<tr><td>${k}<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div></td>`+
    (obj?`<td>${f(tgt[k]===null?null:r1(tgt[k]))}</td>`:"")+
    `<td${over?' class="over"':""}>${sum[k].toFixed(1)}</td><td>${Math.round(p*100)}%</td><td>${Math.round(th[k]*100)}%</td><td><b>${f(rest[k])}</b></td></tr>`}).join("");
  const rt=T===null?null:K.reduce((a,k)=>a+rest[k],0);
  $("rt").innerHTML=`<thead><tr><th style="text-align:left">Type</th>${obj?"<th>Objectif</th>":""}<th>Cumul (km)</th><th>% réel</th><th>% théo.</th><th>Reste à faire</th></tr></thead><tbody>${rows}</tbody>`+
    `<tfoot><tr><td>Total</td>${obj?`<td>${has?r1(T).toFixed(1):"–"}</td>`:""}<td>${all.toFixed(1)}</td><td>${all?"100%":"0%"}</td><td>100%</td><td>${f(rt)}</td></tr></tfoot>`;
  $("rnote").innerHTML=obj
    ?(has?`Calé sur ton objectif de <b>${r1(T).toFixed(1)}</b> km : chaque type = objectif × % théorique, moins ce que tu as fait. En rouge : type qui dépasse sa part.`:"Saisis ton objectif de km pour la semaine.")
    :`Calé sur ce que tu as couru : total visé <b>${T.toFixed(1)}</b> km, déduit du type le plus avancé par rapport à son % théorique.`;
}
daysEl.addEventListener("change",e=>{const t=e.target;if(t.dataset.i!==undefined)S.days[t.dataset.i].t=t.value;save();render()});
daysEl.addEventListener("input",e=>{const t=e.target;if(t.dataset.k!==undefined){S.days[t.dataset.k].km=t.value;save();render(true)}});
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();render()});
$("obj").oninput=e=>{S.obj=e.target.value;save();render(true)};
$("wtype").onchange=e=>{S.wtype=e.target.value;save();render()};
$("start").onchange=e=>{S.start=e.target.value;save()};
$("reset").onclick=()=>{if(confirm("Effacer la semaine et repartir à zéro ?")){S=fresh();save();render()}};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
